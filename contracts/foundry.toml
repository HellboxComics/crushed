[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.17"
evm_version = "paris"
optimizer = true
optimizer_runs = 800
remappings = [
    "seadrop/=lib/seadrop/src/",
    "ERC721A/=lib/seadrop/lib/ERC721A/contracts/",
    "solmate/=lib/seadrop/lib/solmate/src/",
    "utility-contracts/=lib/seadrop/lib/utility-contracts/src/",
    "openzeppelin-contracts/=lib/seadrop/lib/openzeppelin-contracts/contracts/",
    "murky/=lib/seadrop/lib/murky/src/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

# Robinhood Chain (Arbitrum Orbit). block.number is the L1 block there; nothing here depends on it.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
