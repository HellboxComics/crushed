<body class="home">
<main>
  <model-viewer id="cube" poster="cube/0044.webp" alt="A crushed cube. Drag to turn it."

    disable-zoom disable-pan touch-action="pan-y" shadow-intensity="1.1" shadow-softness="0.6"

<script type="module">
  import "./vendor/model-viewer.min.js";
  customElements.whenDefined("model-viewer").then(() => {
    const MV = customElements.get("model-viewer");
    MV.dracoDecoderLocation = new URL("vendor/draco/", location.href).href;   // served from this site, nothing outside
    document.getElementById("cube").src = "cube/0044.glb";                     // load only after the decoder is set
  });
